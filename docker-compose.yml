services:
  webapp:
    build:
      context: .
      dockerfile: WebApp/Dockerfile
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=ispp2108;User=ispp2108;Password=2108;TreatTinyAsBoolean=true;"
    ports:
      - "8923:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: 2108
      MYSQL_DATABASE: ispp2108
      MYSQL_USER: ispp2108
      MYSQL_PASSWORD: 2108
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    ports:
      - "8924:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: 2108
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: